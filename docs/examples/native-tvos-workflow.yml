name: Native tvOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build unsigned native tvOS IPA
        run: scripts/build-native-tvos.sh

      - name: Upload unsigned IPA and provenance
        uses: actions/upload-artifact@v4
        with:
          name: SmartTubeNative-tvOS-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            releases/**/*.ipa
            releases/**/*.sha256
            releases/**/*.provenance.txt
